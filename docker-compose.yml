services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vanta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vanta_local_only}
      POSTGRES_DB: vanta
    ports: ["127.0.0.1:54329:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vanta -d vanta"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis_data:/data"]
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://vanta:${POSTGRES_PASSWORD:-vanta_local_only}@postgres:5432/vanta?schema=public
      REDIS_URL: redis://redis:6379
      BIND_ADDRESS: 0.0.0.0
    ports: ["4000:4000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
volumes:
  postgres_data:
  redis_data:
